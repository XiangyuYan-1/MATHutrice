# Runs the two checks documented in mathutrice/README.md, "Running the check":
# every import crossing a package boundary reaches a public name, and no two
# packages import each other. They are the commands a contributor runs locally,
# so a red run here is reproducible with two lines in a terminal. A green push
# to the fork's default branch is then built once and deployed to staging.
name: Architecture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: architecture
    # A promotion builds nothing, so it has no source check to run.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version: setup-uv publishes no floating `v10` tag.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # uv installs the interpreter pinned in .python-version itself, so there
      # is no separate Python setup step to keep in sync with it. The dev group,
      # which is where tach lives, is part of a default sync.
      - run: uv sync

      # scripts/check_cycles.py reads the real import graph from `tach map`, and
      # both commands expect the directory holding tach.toml -- the checkout
      # root, which is where a step starts.
      - run: uv run tach check

      - run: uv run python scripts/check_cycles.py

  deploy-staging:
    name: deploy to staging
    needs: architecture
    if: github.event_name == 'push' && github.ref == 'refs/heads/course-2026-fallback-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7

      # The commit tag makes the deployed code traceable. If this commit was
      # pushed before, reuse its existing image instead of rebuilding it.
      - name: Build and push the image, unless it exists
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already built"
          else
            docker build \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "REVISION=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the image to staging
        uses: ./.github/actions/deploy-to-app-service
        with:
          image: ${{ steps.image.outputs.image }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          session-secret: ${{ secrets.SESSION_SECRET }}
          dev-login-key: ${{ secrets.DEV_LOGIN_KEY }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          posthog-project-token: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          posthog-environment: staging

  # A promotion reads workflow history rather than asking the staging app what
  # it runs. The newest push whose staging deploy passed is the newest image
  # proven to start there; failed and skipped deploys are logged and ignored.
  last-green-staging:
    name: find staging's last green deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      image: ${{ steps.find.outputs.image }}
      run-url: ${{ steps.find.outputs.run-url }}
      commit: ${{ steps.find.outputs.commit }}
    steps:
      - name: Find the newest run whose staging deploy passed
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_BRANCH: course-2026-fallback-ci
        run: |
          runs=$(gh run list \
            --workflow architecture.yml \
            --branch "$DEPLOY_BRANCH" \
            --event push \
            --limit 100 \
            --json databaseId,headSha \
            --jq '.[] | "\(.databaseId) \(.headSha)"')

          while read -r run sha; do
            [ -n "$run" ] || continue
            deploy=$(gh run view "$run" --json jobs \
              --jq '.jobs[] | select(.name == "deploy to staging") | .conclusion')
            if [ "$deploy" = success ]; then
              image="ghcr.io/${GITHUB_REPOSITORY,,}:$sha"
              run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
              echo "$run_url, commit $sha: deploy to staging passed"
              echo "Promoting $image"
              {
                echo "image=$image"
                echo "run-url=$run_url"
                echo "commit=$sha"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Run $run, commit $sha: deploy to staging ${deploy:-has no result}, skipped"
          done <<< "$runs"

          echo "No push run on $DEPLOY_BRANCH has a successful staging deploy" >&2
          exit 1

  promote-production:
    name: promote to production
    needs: last-green-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      # The checkout supplies only the composite deploy action. No image is
      # built from this workflow_dispatch run.
      - uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy staging's last green image to production
        uses: ./.github/actions/deploy-to-app-service
        with:
          image: ${{ needs.last-green-staging.outputs.image }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          session-secret: ${{ secrets.SESSION_SECRET }}
          dev-login-key: ${{ secrets.DEV_LOGIN_KEY }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          posthog-project-token: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          posthog-environment: production
